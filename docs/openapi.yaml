openapi: 3.0.3
info:
  title: Bookworm Bookstore API
  version: 1.0.0
  description: Demo API for the Bookworm capstone bookstore. Book prices and order totals are in Indian rupees (INR).
servers:
  - url: http://localhost:8080/api
paths:
  /books:
    get:
      summary: Search and filter books
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number, format: double } }
        - { name: maxPrice, in: query, schema: { type: number, format: double } }
        - { name: sort, in: query, schema: { type: string, enum: [featured, price-asc, price-desc, title] } }
      responses:
        "200":
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
  /books/{id}:
    get:
      summary: Get one book
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { description: Book not found }
  /accounts/register:
    post:
      summary: Register a demo account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRegistration" }
      responses:
        "200": { description: Account created }
        "409": { description: Email already registered }
  /accounts/login:
    post:
      summary: Sign into a demo account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountLogin" }
      responses:
        "200": { description: Signed in }
        "401": { description: Email or password is incorrect }
  /orders:
    get:
      summary: Find orders by email
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        "200": { description: Matching orders }
    post:
      summary: Place an order using demo payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Checkout" }
      responses:
        "200": { description: Order confirmation }
        "400": { description: Invalid checkout request }
  /orders/{id}/cancel:
    put:
      summary: Cancel an order within 48 hours
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        "200": { description: Cancelled order }
        "404": { description: Order not found }
        "409": { description: Order cannot be cancelled }
components:
  schemas:
    Book:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        category: { type: string }
        publisher: { type: string }
        format: { type: string }
        price: { type: number, description: Book price in INR }
        description: { type: string }
        coverColor: { type: string }
    AccountRegistration:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    AccountLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Checkout:
      type: object
      required: [customerName, email, phone, address, city, postalCode, paymentMethod, items]
      properties:
        customerName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        paymentMethod: { type: string, enum: [CARD, PAYPAL, CASH_ON_DELIVERY] }
        rewardPointsToUse: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [bookId, quantity]
            properties:
              bookId: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
